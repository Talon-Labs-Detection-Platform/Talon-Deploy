{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "talon-control.fullname" . }}-secrets
  labels:
    {{- include "talon-control.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_SECRET: {{ required "secrets.authSecret is required (openssl rand -hex 32)" .Values.secrets.authSecret | quote }}
  TALON_CONTROL_ENCRYPTION_KEY: {{ required "secrets.encryptionKey is required (openssl rand -hex 32)" .Values.secrets.encryptionKey | quote }}
  TALON_CONTROL_POSTGRES_URL: {{ include "talon-control.postgresUrl" . | quote }}
  {{- with .Values.secrets.setupToken }}
  TALON_CONTROL_SETUP_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.adminEmail }}
  TALON_CONTROL_ADMIN_EMAIL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.adminPassword }}
  TALON_CONTROL_ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- /*
    Dev Sessions credentials. In the Secret rather than the Deployment's env
    because an OAuth token is your Claude account for a year and a Deployment
    body is readable by anyone who can `get deploy`. Omitted entirely when
    unset, so getDevSessionAuthMode() sees an absent variable rather than an
    empty string.
  */}}
  {{- with .Values.devSessions.oauthToken }}
  CLAUDE_CODE_OAUTH_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.devSessions.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.devSessions.codexAccessToken }}
  CODEX_ACCESS_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.devSessions.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.signing.enabled (not .Values.signing.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "talon-control.fullname" . }}-signing
  labels:
    {{- include "talon-control.labels" . | nindent 4 }}
type: Opaque
stringData:
  license-signing-private.pem: |
{{ required "signing.privateKeyPem is required when signing.enabled=true and no existingSecret" .Values.signing.privateKeyPem | indent 4 }}
{{- end }}
