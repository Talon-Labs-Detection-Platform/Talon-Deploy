{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "talon-studio.fullname" . }}-secrets
  labels:
    {{- include "talon-studio.labels" . | nindent 4 }}
type: Opaque
stringData:
  NEXTAUTH_SECRET: {{ .Values.secrets.nextauthSecret | quote }}
  AUTH_SECRET: {{ .Values.secrets.authSecret | quote }}
  TALON_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  TALON_ADMIN_USERNAME: {{ .Values.secrets.adminUsername | quote }}
  TALON_ADMIN_EMAIL: {{ .Values.secrets.adminEmail | quote }}
  TALON_ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  TALON_METRICS_TOKEN: {{ .Values.secrets.metricsToken | quote }}
  {{- if .Values.secrets.licenseKey }}
  # Activated at boot by ensureEnvLicense(). Omitted entirely when unset so an
  # empty value can never look like a licence that failed to verify.
  TALON_LICENSE_KEY: {{ .Values.secrets.licenseKey | quote }}
  {{- end }}
  TALON_LLM_GATEWAY_API_KEY: {{ .Values.config.llmGatewayApiKey | quote }}
  {{- if .Values.postgres.externalUrl }}
  POSTGRES_URL: {{ .Values.postgres.externalUrl | quote }}
  {{- end }}
{{- end }}
