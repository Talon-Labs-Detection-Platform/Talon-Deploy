{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "talon-studio.fullname" . }}-secrets
  labels:
    {{- include "talon-studio.labels" . | nindent 4 }}
type: Opaque
stringData:
  # An empty value is left out, so the container generates it on first boot
  # (secrets, admin password) or runs without it (metrics token).
  {{- range $key, $value := dict
      "NEXTAUTH_SECRET" .Values.secrets.nextauthSecret
      "AUTH_SECRET" .Values.secrets.authSecret
      "TALON_ENCRYPTION_KEY" .Values.secrets.encryptionKey
      "TALON_ADMIN_USERNAME" .Values.secrets.adminUsername
      "TALON_ADMIN_EMAIL" .Values.secrets.adminEmail
      "TALON_ADMIN_PASSWORD" .Values.secrets.adminPassword
      "POSTGRES_PASSWORD" .Values.secrets.postgresPassword
      "TALON_METRICS_TOKEN" .Values.secrets.metricsToken }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.secrets.licenseKey }}
  # Activated at boot by ensureEnvLicense(). Omitted entirely when unset so an
  # empty value can never look like a licence that failed to verify.
  TALON_LICENSE_KEY: {{ .Values.secrets.licenseKey | quote }}
  {{- end }}
  TALON_LLM_GATEWAY_API_KEY: {{ .Values.config.llmGatewayApiKey | quote }}
  {{- if .Values.postgres.externalUrl }}
  POSTGRES_URL: {{ .Values.postgres.externalUrl | quote }}
  {{- end }}
{{- end }}
