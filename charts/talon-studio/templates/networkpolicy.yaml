{{- if .Values.networkPolicy.enabled }}
# Default-deny + a narrow allow-list. A compromised app process (an RCE/SSRF
# class bug, not a hostile tenant — every tenant runs the identical shared
# image) otherwise has unrestricted egress to any host on the cluster
# network and the internet. Ingress is left open cluster-wide since a
# generic chart can't assume a specific ingress-controller/gateway namespace
# name; the SaaS Terraform tenant module ships its own tighter, gateway-
# scoped policy instead of using this one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "talon-studio.fullname" . }}-default-deny
  labels:
    {{- include "talon-studio.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "talon-studio.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
    - ports:
        - port: {{ .Values.config.postgresPort | default "5432" }}
          protocol: TCP
{{- end }}
